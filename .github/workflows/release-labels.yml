# Release labels (Taha, 2026-11-10): on-staging is added when a PR merges into staging;
# verified-on-staging needs a "Staging proof: <link>" line and held-off a "Held off: <reason>" line,
# or the bot removes them with a comment. Rules live in .github/scripts/release-flow.mjs.
name: Release labels

on:
  pull_request:
    branches: [staging]
    types: [closed, labeled, unlabeled, edited]
# unlabeled/edited only refresh the release gate, which re-reads labels and proof every time.
# A deleted comment is picked up at the next refresh (push, label change or Thursday).

permissions: {}

jobs:
  labels:
    name: Release labels
    # Fork PRs get a read-only token; labels are only managed on this repository's branches.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && github.event.pull_request.merged) ||
       github.event.action == 'edited' ||
       ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(fromJSON('["on-staging","verified-on-staging","held-off"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    concurrency:
      group: release-labels-${{ github.event.pull_request.number }}
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ACTION: ${{ github.event.action }}
    steps:
      # The rules come from staging as it was before this PR (its base commit), never from the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: script
        run: |
          if [ -f .github/scripts/release-flow.mjs ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No release flow script on staging before this PR yet."; fi
      - if: steps.script.outputs.ok && (github.event.action == 'closed' || github.event.action == 'labeled')
        run: |
          if [ "$ACTION" = "closed" ]; then node .github/scripts/release-flow.mjs mark-on-staging
          else node .github/scripts/release-flow.mjs check-label; fi
      # A label change can turn the release gate green or red: refresh an open release PR.
      - name: Refresh the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Before the first release puts release-pr.yml on main there is nothing to refresh.
        run: gh workflow run release-pr.yml --ref main -f create=false || echo "::notice::No release PR workflow on main yet."
