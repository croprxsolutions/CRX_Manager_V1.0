_format_version: "2.1"
_transform: true

services:
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth
        paths: [/auth/v1/]
    plugins:
      - name: cors
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest
        paths: [/rest/v1/]
    plugins:
      - name: cors
  - name: storage
    url: http://storage:5000/
    routes:
      - name: storage
        paths: [/storage/v1/]
    plugins:
      - name: cors
  # The migration tool's only way to the database, which has no published port of its own.
  - name: db
    url: tcp://db:5432
    routes:
      - name: db
        protocols: [tcp]
        destinations:
          - port: 5432
