# Release labels (Taha, 2026-11-10): on-staging is added when a PR merges into staging;
# verified-on-staging needs a "Staging proof: <link>" line and held-off a "Held off: <reason>" line,
# or the bot removes them with a comment. Rules live in .github/scripts/release-flow.mjs.
name: Release labels

on:
  pull_request:
    branches: [staging]
    types: [closed, labeled]
# Deleting a proof line later doesn't remove the label, but the weekly release gate re-reads the
# proof itself, so the release can't merge without it.

permissions: {}

jobs:
  labels:
    name: Release labels
    # Fork PRs get a read-only token; labels are only managed on this repository's branches.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && github.event.pull_request.merged) ||
       (github.event.action == 'labeled' &&
        contains(fromJSON('["on-staging","verified-on-staging","held-off"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ACTION: ${{ github.event.action }}
    steps:
      # The rules come from staging as it was before this PR: the parent of its merge commit once
      # merged, its base commit before that. Never the PR's own copy of the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false
      - id: script
        env:
          MERGED: ${{ github.event.pull_request.merged }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$MERGED" = "true" ]; then src="$MERGE_SHA^1"; else src="$BASE_SHA"; fi
          if git show "$src:.github/scripts/release-flow.mjs" > "$RUNNER_TEMP/release-flow.mjs" 2>/dev/null; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release flow script on staging before this PR yet."
          fi
      - if: steps.script.outputs.ok && (github.event.action == 'closed' || github.event.action == 'labeled')
        run: |
          if [ "$ACTION" = "closed" ]; then node "$RUNNER_TEMP/release-flow.mjs" mark-on-staging
          else node "$RUNNER_TEMP/release-flow.mjs" check-label; fi
