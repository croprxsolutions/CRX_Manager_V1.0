# Staging-first release flow (Taha, 2026-11-10). Feature PRs go to staging; only release/next and
# hotfix/<name> go to main; main always stays inside staging's history.
# Everything that enforces is inert until the repository variable RELEASE_FLOW is "on".
name: Release flow

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, edited] # edited = base changed (retargeted to main)
  push:
    branches: [main, staging]
  schedule:
    - cron: '30 3 * * *' # nightly, 07:30 Dubai
  workflow_dispatch:

permissions: {}

jobs:
  scripts:
    name: Release flow scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/release-flow.test.mjs .github/scripts/release-slack.test.mjs

  guard:
    # One check per base, so a run on a staging PR can never satisfy the one required on main.
    name: Release flow guard (${{ github.base_ref }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write # hotfix PRs: ask the release bot for their release-gate
      contents: read
    env:
      RELEASE_FLOW: ${{ vars.RELEASE_FLOW }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only release/next and hotfix/<name> from this repository into main, containing main
        run: |
          if [ "$BASE_REF" != "main" ]; then echo "Not a PR into main; nothing to check."; exit 0; fi
          if [ "$RELEASE_FLOW" != "on" ]; then echo "::notice::Release flow not switched on yet; nothing enforced."; exit 0; fi
          if [ "$HEAD_REPO" != "$REPO" ]; then echo "::error::PRs into main must come from a branch in $REPO, not a fork."; exit 1; fi
          # The rule comes from main's copy of the script, never the PR's own (a PR can't vote for itself).
          git show origin/main:.github/scripts/release-flow.mjs > "$RUNNER_TEMP/release-flow.mjs"
          node "$RUNNER_TEMP/release-flow.mjs" check-head "$HEAD_REF"
          if ! git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            echo "::error::This branch is missing commits that are on main. Merge main into it (merge commit), then push."
            exit 1
          fi
          if [ "$HEAD_REF" = "release/next" ]; then
            # Its files must equal staging merged with main, apart from the bot's version files.
            expected=$(git merge-tree --write-tree origin/staging origin/main) || { echo "::error::staging and main don't merge cleanly; merge the back-merge PR first."; exit 1; }
            git diff --name-only "$expected" "$HEAD_SHA" | node "$RUNNER_TEMP/release-flow.mjs" check-release-files
            # Inside the bot's files, only the version and the generated notes may differ.
            node "$RUNNER_TEMP/release-flow.mjs" check-release-content "$expected" "$HEAD_SHA"
          fi
          if [ "${HEAD_REF#hotfix/}" != "$HEAD_REF" ]; then
            # A hotfix may carry nothing from staging that main hasn't released.
            if ! git merge-base --is-ancestor "$(git merge-base "$HEAD_SHA" origin/staging)" origin/main; then
              echo "::error::This hotfix carries unreleased staging work. Cut hotfix/<name> from main."
              exit 1
            fi
            # release-gate (required on main) comes from the release bot, never from this job.
            gh workflow run release-pr.yml --repo "$REPO" --ref main -f create=false -f hotfix_pr="$PR_NUMBER"
          fi

  main-inside-staging:
    # Never make this a required check: it is skipped on PRs, and a skipped required job counts as passed.
    name: Main inside staging
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_FLOW: ${{ vars.RELEASE_FLOW }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          if [ "$RELEASE_FLOW" != "on" ]; then echo "::notice::Release flow not switched on yet; nothing enforced."; exit 0; fi
          if ! git merge-base --is-ancestor origin/main origin/staging; then
            echo "::error::main has commits that staging lacks. Merge the open back-merge PR (main -> staging) with a merge commit, not squash."
            exit 1
          fi

  refresh-release-pr:
    # Holds no secrets: it only asks main's Release PR workflow to refresh an open release PR.
    name: Refresh release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      RELEASE_FLOW: ${{ vars.RELEASE_FLOW }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          if [ "$RELEASE_FLOW" != "on" ]; then echo "::notice::Release flow not switched on yet."; exit 0; fi
          gh workflow run release-pr.yml --ref main -f create=false

  back-merge-reminder:
    # Nightly, Slack only: a back-merge still open 12 hours after a release or hotfix gets one
    # broadcast warning in its thread. Touches no branch, PR content or status.
    name: Back-merge reminder
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-bot
    permissions:
      contents: read
    env:
      RELEASE_FLOW: ${{ vars.RELEASE_FLOW }}
    steps:
      - name: Switched on?
        id: on
        run: if [ "$RELEASE_FLOW" = "on" ]; then echo "yes=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Release flow not switched on yet."; fi
      - if: steps.on.outputs.yes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release bot token
        if: steps.on.outputs.yes
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-pull-requests: write
      - if: steps.on.outputs.yes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SLACK_RELEASE_TOKEN: ${{ secrets.SLACK_RELEASE_TOKEN }}
          SLACK_RELEASE_CHANNEL: ${{ secrets.SLACK_RELEASE_CHANNEL }}
        run: node .github/scripts/release-flow.mjs back-merge-slack

  back-merge:
    name: Back-merge main into staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The release bot's key lives only in this environment, which deploys from main and staging
    # alone, so no pull_request workflow can read it.
    environment: release-bot
    concurrency:
      group: release-flow-back-merge
    permissions:
      contents: read
    env:
      RELEASE_FLOW: ${{ vars.RELEASE_FLOW }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Is a back-merge needed?
        id: need
        run: |
          if [ "$RELEASE_FLOW" != "on" ]; then echo "::notice::Release flow not switched on yet; no back-merge PR."; exit 0; fi
          echo "on=1" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor origin/main origin/staging; then echo "staging already contains main"; exit 0; fi
          echo "yes=1" >> "$GITHUB_OUTPUT"
      # The release bot App, not GITHUB_TOKEN: this repo doesn't let Actions open PRs, and a PR the
      # built-in token opens gets no CI runs of its own.
      - name: Release bot token
        if: steps.need.outputs.on
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - name: Open the back-merge PR
        id: bm
        if: steps.need.outputs.yes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Owner-qualified, so a fork's own "main" branch PR doesn't count as the back-merge.
          open=$(gh api "repos/$GH_REPO/pulls?state=open&base=staging&head=$OWNER:main" --jq '.[0].number // empty')
          if [ -n "$open" ]; then echo "::notice::Back-merge PR #$open is already open; it now carries ${SHA:0:9} too."; exit 0; fi
          url=$(gh pr create --base staging --head main \
            --title "chore(staging): back-merge main after ${SHA:0:9}" \
            --body "$(printf '%s\n' \
              'Brings what just landed on main (a release or a hotfix) back into staging, so main stays inside staging.' '' \
              '**Merge with "Create a merge commit", never squash.** Same day, please: the "Main inside staging" check stays red until this lands.' '' \
              'Opened by the release flow workflow.' '' '## Follow-ups' '- None')")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      # The release card turns "shipped", "vX.Y.Z is live" (or the hotfix) is posted, and the new
      # back-merge is threaded under it. Optional: without the Slack secrets nothing is posted.
      - name: Tell Slack
        if: steps.need.outputs.on
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACK_MERGE_PR: ${{ steps.bm.outputs.number }}
          SLACK_RELEASE_TOKEN: ${{ secrets.SLACK_RELEASE_TOKEN }}
          SLACK_RELEASE_CHANNEL: ${{ secrets.SLACK_RELEASE_CHANNEL }}
        run: node .github/scripts/release-flow.mjs main-pushed
