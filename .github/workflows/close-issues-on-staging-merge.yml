# Close fixed issues when a PR merges into staging (Mason, 2026-11-19).
# GitHub only acts on "Closes #N" when a PR merges into the default branch (main); feature PRs
# merge into staging, so their issues stayed open and needed hand clean-up. This reads the merged
# PR's description and closes each issue on a line that STARTS with a closing word ("Closes #N",
# "- Fixes #N"), so "do not close #N" mid-sentence never closes anything. Write
# "Part of #N" for partial work: it is left open. No checkout: no PR code runs with this token.
name: Close fixed issues on staging merge

on:
  pull_request:
    branches: [staging]
    types: [closed]

permissions: {}

jobs:
  close:
    name: Close fixed issues
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - run: |
          nums=$(printf '%s\n' "$BODY" \
            | grep -oiE '^[[:space:]]*([-*][[:space:]]+)?(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          [ -z "$nums" ] && { echo "No closing references in #$PR."; exit 0; }
          for n in $nums; do
            info=$(gh api "repos/$GH_REPO/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv' 2>/dev/null) \
              || { echo "::warning::#$n not found"; continue; }
            state=${info%%$'\t'*}; is_pr=${info##*$'\t'}
            if [ "$is_pr" = "true" ] || [ "$state" != "open" ]; then echo "Skip #$n ($state, pr=$is_pr)"; continue; fi
            gh issue close "$n" --reason completed \
              --comment "Fixed by #$PR, merged into staging. It goes live with the next release."
            echo "Closed #$n"
          done
